<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="25%" stop-color="#ffe89e"/>
      <stop offset="60%" stop-color="#dfba73"/>
      <stop offset="100%" stop-color="#8a671d"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f192c"/>
      <stop offset="60%" stop-color="#070c16"/>
      <stop offset="100%" stop-color="#020408"/>
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#dfba73" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background Shield/Square -->
  <rect width="64" height="64" rx="14" fill="url(#bgGrad)"/>
  <rect x="1.5" y="1.5" width="61" height="61" rx="12.5" stroke="url(#goldGrad)" stroke-width="1.5" stroke-opacity="0.85"/>

  <!-- Inner Geometric Framing -->
  <circle cx="32" cy="32" r="24" stroke="url(#goldGrad)" stroke-width="0.8" stroke-dasharray="2 2" stroke-opacity="0.6"/>

  <!-- Polycrayons "P" Luxury Architectural Monogram -->
  <g filter="url(#goldGlow)">
    <!-- Tower Stem & Loop -->
    <path d="M22 17V47M22 17H35C41.6 17 46 21 46 27.5C46 34 41.6 38 35 38H22" stroke="url(#goldGrad)" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Architectural Diamond Crown -->
    <polygon points="32,8 34.5,12 32,16 29.5,12" fill="#ffffff"/>
    <circle cx="32" cy="12" r="1" fill="#ffe89e"/>
  </g>
</svg>
